<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let squad = [

            { id: 1, name: "Nguyen Van A", goals: 10, position: "FW" },

            { id: 2, name: "Tran Van B", goals: 5,  position: "MF" },

            { id: 3, name: "Le Van C",   goals: 0,  position: "DF" },

            { id: 4, name: "Pham Van D", goals: 12, position: "FW" },

            { id: 5, name: "Dang Van E", goals: 0,  position: "GK" }

        ];
        do {
            let choice = +prompt(
                `--- FOOTBALL MANAGER PRO ---

                1. Xem đội hình

                2. Thêm cầu thủ

                3. Tìm kiếm (theo ID)

                4. Cập nhật bàn thắng

                5. Xóa cầu thủ (Chuyển nhượng)

                0. Thoát
                Vui lòng nhập lựa chọn của bạn (0-5):`
        );

                switch(choice){
                    case 1:
                        let viewTeam = squad.forEach(function(player) {
                            alert(`ID: ${player.id} - Name: ${player.name} - Goals: ${player.goals} - Position: ${player.position}`);
                        });
                        break;
                    case 2:
                        let name = prompt("Nhập tên cầu thủ:");
                        let goals = +prompt("Nhập số bàn thắng:");
                        let position = prompt("Nhập vị trí (FW/MF/DF/GK):").toUpperCase();
                        let newId = squad.length > 0 ? squad[squad.length - 1].id + 1 : 1;
                        let newPlayer = squad.push({ id: newId, name, goals, position });
                        alert("Thêm cầu thủ thành công!");
                        break;
                    case 3:
                        let searchId = +prompt("Nhập ID cầu thủ cần tìm:");
                        let foundPlayer = squad.find(player => player.id === searchId);
                        if(foundPlayer){
                            alert(`Tìm thấy: ID: ${foundPlayer.id} - Name: ${foundPlayer.name} - Goals: ${foundPlayer.goals} - Position: ${foundPlayer.position}`);
                        }else{
                            alert("Không tìm thấy cầu thủ nào!");
                        }
                        break;
                    case 4:
                        let updateId = +prompt("Nhập cầu thủ cần cập nhật bàn thắng(ID):");
                        let playerToUpdate = squad.find(player => player.id === updateId);
                        if(playerToUpdate){
                            let newGoals = +prompt(`Nhập số bàn thắng mới cho ${playerToUpdate.name}:`);
                            playerToUpdate.goals = newGoals;
                            alert("Cập nhật bàn thắng thành công!");
                        }else{
                            alert("Không tìm thấy cầu thủ nào!");
                        }
                        break;
                    case 5:
                        let deleteId = +prompt("Nhập ID cầu thủ cần xóa:");
                        let indexToDelete = squad.findIndex(player => player.id === deleteId);
                        if(indexToDelete !== -1){
                            squad.splice(indexToDelete, 1);
                            squad.filter(player => player.id > deleteId).forEach(player => player.id--);
                            alert("Xóa cầu thủ thành công!");
                        }else{
                            alert("Không tìm thấy cầu thủ nào!");
                        }
                        break;
                    case 0:
                        alert("Thoát chương trình!");
                        break;
                    default:
                        alert("Lựa chọn không hợp lệ, vui lòng nhập lại!");
                        break;
                }
        } while(choice !== 0);
    </script>
</body>
</html>
