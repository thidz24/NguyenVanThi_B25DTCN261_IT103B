<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
         const players = [
            { name: "Messi", position: "Foward", age: 36, goals: 25, assists: 15, matches: 34, yellowCard: 2 },
            { name: "Ronaldo", position: "Foward", age: 39, goals: 30, assists: 10, matches: 38, yellowCard: 4 },
            { name: "Neymar", position: "Foward", age: 32, goals: 18, assists: 20, matches: 32, yellowCard: 3 },
            { name: "De Bruyne", position: "Midfielder", age: 33, goals: 8, assists: 25, matches: 35, yellowCard: 1 },
            { name: "Kante", position: "Midfielder", age: 33, goals: 2, assists: 5, matches: 36, yellowCard: 0 },
            { name: "Van Dijk", position: "Defender", age: 33, goals: 5, assists: 3, matches: 33, yellowCard: 2 },
            { name: "Alisson", position: "Goalkeeper", age: 31, goals: 0, assists: 1, matches: 37, yellowCard: 0 }
        ];
        function generateRankingReport(minMatches, players) {

            console.log("XẾP HẠNG ĐỘI BÓNG (từ " + minMatches + " trận trở lên)\n");

            const filtered = players
                .map((player, index) => ({ ...player, originalIndex: index }))
                .filter(player => player.matches >= minMatches);

            const enriched = filtered.map(player => {

                const performanceScore = Number(
                    ((player.goals + player.assists) / player.matches).toFixed(2)
                );

                const efficiencyScore = Number(
                    (performanceScore - (player.yellowCard / player.matches) * 10).toFixed(2)
                );

                return {
                    ...player,
                    performanceScore,
                    efficiencyScore
                };
            });

            const ranking = enriched.sort((a, b) => {

                if (b.efficiencyScore !== a.efficiencyScore)
                    return b.efficiencyScore - a.efficiencyScore;

                if (b.performanceScore !== a.performanceScore)
                    return b.performanceScore - a.performanceScore;

                if (b.goals !== a.goals)
                    return b.goals - a.goals;

                return a.originalIndex - b.originalIndex;
            });

            ranking.forEach((player, index) => {
                console.log(
                    `${index + 1}. ${player.name} - Efficiency: ${player.efficiencyScore} | ` +
                    `Performance: ${player.performanceScore} | Goals: ${player.goals}`
                );
            });

            console.log("\nTổng số cầu thủ xếp hạng:", ranking.length);

            if (ranking.length > 0) {
                console.log("Cầu thủ xuất sắc nhất:", ranking[0].name);

                const top3 = ranking.slice(0, 3);
                const avgEfficiency = Number(
                    (top3.reduce((sum, p) => sum + p.efficiencyScore, 0) / top3.length).toFixed(2)
                );

                console.log("Trung bình efficiency top 3:", avgEfficiency);
            } else {
                console.log("Không có cầu thủ đủ điều kiện.");
            }
        }
        generateRankingReport(30, players);
    </script>
</body>
</html>
