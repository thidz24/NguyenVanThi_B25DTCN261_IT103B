<body>
    <script>
        let borrowName = prompt("Nhập tên người mượn: ");
        let bookName = prompt("Nhập tên sách: ");
        let bookDay = +prompt("Nhập số ngày mượn: ");
        let borrowSum = 0;
        if(bookDay>0) {
            for(let i=1;i<bookDay;i++) {
                if(bookDay>14) {
                    console.log("Cảnh báo: Thời gian mượn vượt quy định(14 ngày)");
                } else {
                    console.log("Mượn thành công");
                }
                borrowSum++;
            }
            console.log("Tổng số lượt mượn: " + borrowSum);
        } else {
            console.log("Số lần mượn không hợp lệ");
        }
