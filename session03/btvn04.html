<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let continueCheck;
        let totalBooks = 0;
        let lostBooks = 0;
        let outOfStockBooks = 0;
        let highStockBooks = 0;
        let normalStockBooks = 0;
        do {
            continueCheck = prompt("Tiếp tục kiểm kê sách tiếp theo? (có/không)").toLowerCase()
            if (continueCheck === "không") {
                break;
            }
            if (continueCheck === "có") {
                let bookId;
                do {
                    bookId = prompt("Nhập mã sách (không được để trống):");
                } while (!bookId);

                let bookTitle = prompt("Nhập tên sách:");
                let quantity = parseInt(
                    prompt("Nhập số lượng thực tế trong kho (≥ 0):")
                );
                let status = parseInt(
                    prompt("Nhập tình trạng sách:\n1 - Bình thường (có thể cho mượn)\n2 - Mất")
                );
                if (status === 2) {
                    console.log("Sách mất");
                    lostBooks++;
                } else if (status === 1 && quantity === 0) {
                    console.log("Sách hết (vẫn còn trong hệ thống)");
                    outOfStockBooks++;
                } else if (status === 1 && quantity >= 10) {
                    console.log("Sách tồn kho nhiều");
                    highStockBooks++;
                } else if (status === 1 && quantity >= 1 && quantity <= 9) {
                    console.log("Sách tồn kho bình thường");
                    normalStockBooks++;
                } else {
                    console.log("Dữ liệu không hợp lệ");
                }
                totalBooks++;
            }
        } while (true);
        console.log("Tổng số sách đã kiểm kê: " + totalBooks);
        console.log("Số sách mất: " + lostBooks);
        console.log("Số sách hết hàng: " + outOfStockBooks);
    </script>
</body>
</html>
